services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
      POSTGRES_DB: saldo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo -d saldo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: jdbc:postgresql://db:5432/saldo
      DATABASE_USERNAME: saldo
      DATABASE_PASSWORD: saldo
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
