server:
  port: ${PORT:8000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30d
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/saldo}
    username: ${DATABASE_USERNAME:saldo}
    password: ${DATABASE_PASSWORD:saldo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
